name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: CI only ever needs to read the tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_SUMMARY: "true"

  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      # CI credentials for an ephemeral throwaway database — not a secret.
      DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5432/opspilot_test
      OPSPILOT_ENV: test
      OPSPILOT_PLANNER: rules          # no API key in CI: deterministic planner only
      OPSPILOT_INTEGRATIONS: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"          # matches the version that wrote uv.lock
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest --cov=app --cov-report=term-missing
      - run: uv run alembic upgrade head
      - run: uv run python -m app.evaluation.cli run --suite all

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Needed only to export the backend's OpenAPI schema (app.openapi() —
      # no server, no database) so the "types are reproducible" check below
      # has the same contract a developer would generate against locally.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"          # matches the version that wrote uv.lock
          python-version: "3.12"
      - working-directory: backend
        run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Verify src/lib/api/schema.d.ts matches the backend contract
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test -- --run
      - working-directory: frontend
        run: npm run build
