name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: CI only ever needs to read the tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_SUMMARY: "true"

  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      # CI credentials for an ephemeral throwaway database — not a secret.
      DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5432/opspilot_test
      OPSPILOT_ENV: test
      OPSPILOT_PLANNER: rules          # no API key in CI: deterministic planner only
      OPSPILOT_INTEGRATIONS: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"          # matches the version that wrote uv.lock
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      # TEST-006 / §18.4: backend coverage floor is 80% (pyproject.toml
      # [tool.coverage.report].fail_under is the source of truth; repeated
      # here so the number is visible in the workflow itself).
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - run: uv run alembic upgrade head
      - run: uv run python -m app.evaluation.cli run --suite all

  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Skips cleanly until FE-001 lands the Next.js scaffold and lockfile.
      - id: probe
        run: echo "ready=${{ hashFiles('frontend/package-lock.json') != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.probe.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.probe.outputs.ready == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
