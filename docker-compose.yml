# ---------------------------------------------------------------------------
# OpsPilot AI — local development stack.
#
#   docker compose up -d db api                 # backend + database
#   docker compose --profile frontend up        # adds the Next.js dev server
#
# Secrets: every value comes from `.env` (copy `.env.example`). No credential
# is ever written into this file.
# ---------------------------------------------------------------------------
name: opspilot

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opspilot} -d ${POSTGRES_DB:-opspilot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        # Local compose is a development stack: `docker compose exec api
        # pytest` has to work, so this image keeps the dev extras a hosted
        # build leaves out.
        INSTALL_DEV: "true"
    env_file: [.env]
    environment:
      # Inside the network the database is `db`, not `localhost`.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-opspilot}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Dev ergonomics: live reload against the working tree.
      - ./backend:/srv
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Enabled once FE-001 scaffolds the Next.js app: `--profile frontend`.
  web:
    profiles: ["frontend"]
    image: node:22-alpine
    working_dir: /app
    env_file: [.env]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on: [api]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --hostname 0.0.0.0"]

volumes:
  pgdata:
  web_node_modules:
